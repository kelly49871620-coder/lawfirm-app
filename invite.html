<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>會議邀請</title>
  <style>
    :root{--blue:#11a7df;--line:#09c755;--ink:#111;--muted:#777;--paper:#fff;--bg:#f5f3ef}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
    main{max-width:720px;margin:0 auto;padding:32px 18px 50px}.card{background:var(--paper);border-radius:32px;padding:42px 36px;box-shadow:0 18px 42px #00000012}
    .eyebrow{color:var(--blue);font-weight:800;font-size:20px}.title{font-size:clamp(32px,7vw,50px);line-height:1.18;margin:16px 0 20px}.desc{font-size:20px;color:#444;white-space:pre-wrap;line-height:1.6;margin:0 0 30px}
    .facts{border-top:1px solid #ddd;padding-top:24px;margin:0}.facts div{display:grid;grid-template-columns:105px 1fr;gap:12px;margin:15px 0;font-size:20px}.facts dt{color:#888}.facts dd{margin:0;word-break:break-word}
    .notice{margin:28px 0;background:#fff8dd;border:1px solid #e8bd43;border-radius:16px;padding:16px 18px;line-height:1.55;color:#684d00}
    button,a.action{width:100%;min-height:74px;border:0;border-radius:18px;margin-top:14px;font:inherit;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
    .join{background:var(--blue);color:#fff}.line{background:var(--line);color:#fff}.calendar{background:#f1f0ed;color:#111}.foot{text-align:center;color:#aaa;margin-top:32px}.error{background:#fff0f0;color:#8b0000;border:1px solid #e4b0b0;border-radius:16px;padding:20px;line-height:1.6}
    @media(max-width:520px){main{padding:18px 12px 36px}.card{padding:30px 22px;border-radius:25px}.facts div{grid-template-columns:76px 1fr;font-size:17px}.desc{font-size:17px}button,a.action{min-height:62px;font-size:18px}}
  </style>
</head>
<body><main><section id="card" class="card" hidden>
  <div class="eyebrow">會議邀請</div><h1 id="title" class="title"></h1><p id="desc" class="desc"></p>
  <dl class="facts"><div><dt>時間</dt><dd id="time"></dd></div><div><dt>地點</dt><dd>線上會議</dd></div><div id="passwordRow"><dt>密碼</dt><dd id="password"></dd></div><div><dt>主辦</dt><dd id="host"></dd></div></dl>
  <div class="notice"><strong>錄音告知</strong><br>本場會議將由主辦人的電腦錄音，並製作逐字稿與摘要。若不同意，請先聯絡主辦人，不要進入會議。</div>
  <a id="join" class="action join" rel="noopener noreferrer">前往會議</a>
  <button id="share" class="line">分享到 LINE</button>
  <a id="google" class="action calendar" target="_blank" rel="noopener noreferrer">加入 Google 行事曆</a>
  <button id="apple" class="calendar">加入 Apple 行事曆</button>
 </section><div id="error" class="error" hidden>邀請連結不完整或已損壞。請向主辦人索取新的連結。</div><div class="foot" id="foot"></div></main>
<script>
(()=>{'use strict';
 const $=id=>document.getElementById(id), fail=()=>{$('error').hidden=false};
 const b64decode=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(Array.from(atob(s),c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''))};
 const escIcs=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
 const compact=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 let data;try{const raw=location.hash.slice(1);if(!raw.startsWith('v1.'))throw 0;data=JSON.parse(b64decode(raw.slice(3)))}catch(_){fail();return}
 const required=['title','start','end','url','host'];if(required.some(k=>typeof data[k]!=='string'||!data[k])){fail();return}
 let start=new Date(data.start),end=new Date(data.end),url;try{url=new URL(data.url);if(url.protocol!=='https:')throw 0}catch(_){fail();return}
 if(!Number.isFinite(start.getTime())||!Number.isFinite(end.getTime())||end<=start){fail();return}
 $('title').textContent=data.title;$('desc').textContent=data.description||'';$('desc').hidden=!data.description;
 const fmt=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
 $('time').textContent=fmt.format(start)+'–'+new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}).format(end);
 $('password').textContent=data.password||'';$('passwordRow').hidden=!data.password;$('host').textContent=data.host;$('foot').textContent=data.host;
 $('join').href=url.href;
 const page=location.href,shareText=`會議邀請｜${data.title}\n${fmt.format(start)}\n${page}`;
 $('share').onclick=()=>{location.href='https://line.me/R/share?text='+encodeURIComponent(shareText)};
 const google=new URL('https://calendar.google.com/calendar/render');google.searchParams.set('action','TEMPLATE');google.searchParams.set('text',data.title);google.searchParams.set('dates',compact(start)+'/'+compact(end));google.searchParams.set('details',(data.description||'')+'\n\n會議連結：'+url.href+(data.password?'\n密碼：'+data.password:''));google.searchParams.set('location','線上會議');$('google').href=google.href;
 $('apple').onclick=()=>{const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kelly Meeting//ZH-TW','BEGIN:VEVENT','UID:'+crypto.randomUUID()+'@kelly-meeting','DTSTAMP:'+compact(new Date()),'DTSTART:'+compact(start),'DTEND:'+compact(end),'SUMMARY:'+escIcs(data.title),'DESCRIPTION:'+escIcs((data.description||'')+'\n會議連結：'+url.href+(data.password?'\n密碼：'+data.password:'')),'LOCATION:線上會議','END:VEVENT','END:VCALENDAR'].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='meeting.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 $('card').hidden=false;
})();
</script></body></html>
